[package]
name = "ai-bridge"
version = "0.1.0"
edition = "2024"

[dependencies]
aho-corasick = "1"
anyhow = "1.0"
arc-swap = "1.7"
async-stream = "0.3"
axum = "0.7"
base64 = "0.22"
bytes = "1.7"
dashmap = "6.1"
dotenvy = "0.15"
futures-util = "0.3"
hex = "0.4"
hmac = "0.12"
memchr = "2.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "http2"] }
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.40", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2.5"
