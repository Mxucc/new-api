# Nginx example: keep the new-api dashboard on new-api, but send model relay
# protocol entrypoints through ai-bridge.
#
# Topology assumed by this example:
#   client -> nginx :443
#   nginx  -> ai-bridge http://127.0.0.1:8080
#   nginx  -> new-api   http://127.0.0.1:3000
#
# ai-bridge should point back to new-api:
#   AI_BRIDGE_UPSTREAM_BASE_URL=http://127.0.0.1:3000

upstream ai_bridge_backend {
    server 127.0.0.1:8080;
    keepalive 64;
}

upstream new_api_backend {
    server 127.0.0.1:3000;
    keepalive 64;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    server_name example.com;

    # For large image/audio/video relay requests. Adjust for your deployment.
    client_max_body_size 128m;

    # Long-running image/video/SSE requests should not be buffered by Nginx.
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_http_version 1.1;

    # Preserve caller identity. ai-bridge appends its peer IP before forwarding
    # to new-api, so new-api can still resolve the original client IP.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Give ai-bridge enough time for queueing, transparent 429 retry, and
    # upstream image/video generation. Tune to match AI_BRIDGE_REQUEST_TIMEOUT_SECS.
    proxy_connect_timeout 30s;
    proxy_send_timeout 900s;
    proxy_read_timeout 900s;

    # new-api model relay protocols routed through ai-bridge.
    location = /v1 { proxy_pass http://ai_bridge_backend; }
    location /v1/ { proxy_pass http://ai_bridge_backend; }

    location = /v1beta { proxy_pass http://ai_bridge_backend; }
    location /v1beta/ { proxy_pass http://ai_bridge_backend; }

    location = /mj { proxy_pass http://ai_bridge_backend; }
    location /mj/ { proxy_pass http://ai_bridge_backend; }

    location = /suno { proxy_pass http://ai_bridge_backend; }
    location /suno/ { proxy_pass http://ai_bridge_backend; }

    location = /kling/v1 { proxy_pass http://ai_bridge_backend; }
    location /kling/v1/ { proxy_pass http://ai_bridge_backend; }

    location = /jimeng { proxy_pass http://ai_bridge_backend; }
    location /jimeng/ { proxy_pass http://ai_bridge_backend; }

    location = /pg { proxy_pass http://ai_bridge_backend; }
    location /pg/ { proxy_pass http://ai_bridge_backend; }

    # new-api also exposes /:mode/mj, for example /turbo/mj/submit/imagine.
    # This regex intentionally excludes /api and only captures one leading mode
    # path segment before /mj.
    location ~ ^/(?!api(?:/|$))[^/]+/mj(?:/|$) {
        proxy_pass http://ai_bridge_backend;
    }

    # Everything else, including /api/* dashboard/admin routes and the web UI,
    # stays on new-api directly.
    location / {
        proxy_pass http://new_api_backend;
    }
}
