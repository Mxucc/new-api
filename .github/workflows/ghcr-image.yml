name: Publish GHCR image

# Upstream sync is handled outside GitHub Actions (PI-Desktop scheduled task),
# so this workflow only builds and pushes the container image for every commit
# that lands on main.
#
# Each architecture builds on a runner of its own architecture, so nothing runs
# under emulation: the two builds run side by side and a third job stitches the
# per-architecture images into one multi-arch manifest.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            slug: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            slug: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Tags are needed so the image reports the upstream release it was
          # built from instead of an opaque date and hash.
          fetch-depth: 0

      - name: Resolve image name and tags
        id: image
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/$(printf '%s' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          short_sha="$(git rev-parse --short HEAD)"
          version="$(git describe --tags --match 'v[0-9]*' 2>/dev/null || true)"
          if [ -z "${version}" ]; then
            version="main-$(date -u +'%Y%m%d')-${short_sha}"
          fi
          echo "VERSION=${version}" > VERSION
          {
            echo "name=${image}"
            echo "version=${version}"
            echo "short_sha=${short_sha}"
          } >> "${GITHUB_OUTPUT}"
          echo "Building ${image} for ${{ matrix.platform }} (${version})"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}

      # One tag per platform would race between the two jobs, so each job pushes
      # its image by digest only; the merge job below publishes the real tags.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.slug }}
          cache-to: type=gha,mode=max,scope=${{ matrix.slug }}
          provenance: mode=max
          sbom: true

      - name: Export digest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${RUNNER_TEMP}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.slug }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish multi-arch manifest
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - name: Resolve image name and tags
        id: image
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/$(printf '%s' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          short_sha="${GITHUB_SHA::7}"
          {
            echo "name=${image}"
            echo "short_sha=${short_sha}"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the manifest
        id: manifest
        shell: bash
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          image="${{ steps.image.outputs.name }}"
          short_sha="${{ steps.image.outputs.short_sha }}"
          count="$(find . -maxdepth 1 -type f | wc -l | tr -d ' ')"
          if [ "${count}" -ne 2 ]; then
            echo "expected 2 per-architecture digests, found ${count}" >&2
            exit 1
          fi
          docker buildx imagetools create \
            -t "${image}:main" \
            -t "${image}:latest" \
            -t "${image}:sha-${short_sha}" \
            $(printf "${image}@sha256:%s " *)
          digest="$(docker buildx imagetools inspect "${image}:main" --format '{{.Manifest.Digest}}')"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Output digest
        shell: bash
        run: |
          {
            echo "### GHCR image"
            echo '```'
            echo "${{ steps.image.outputs.name }}:main"
            echo "${{ steps.image.outputs.name }}:latest"
            echo "${{ steps.image.outputs.name }}:sha-${{ steps.image.outputs.short_sha }}"
            echo "${{ steps.manifest.outputs.digest }}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
