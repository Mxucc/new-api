name: Publish GHCR image

# Upstream sync is handled outside GitHub Actions (PI-Desktop scheduled task),
# so this workflow only builds and pushes the container image for every commit
# that lands on main.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_push:
    name: Build & push multi-arch image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1

      - name: Resolve image name and tags
        id: image
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/$(printf '%s' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          short_sha="$(git rev-parse --short HEAD)"
          version="main-$(date -u +'%Y%m%d')-${short_sha}"
          echo "VERSION=${version}" > VERSION
          {
            echo "name=${image}"
            echo "version=${version}"
            echo "short_sha=${short_sha}"
          } >> "${GITHUB_OUTPUT}"
          echo "Publishing ${image}:main, :latest and :sha-${short_sha} (${version})"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}

      - name: Build & push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:main
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:sha-${{ steps.image.outputs.short_sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Output digest
        shell: bash
        run: |
          {
            echo "### GHCR image"
            echo '```'
            echo "${{ steps.image.outputs.name }}:main"
            echo "${{ steps.image.outputs.name }}:latest"
            echo "${{ steps.image.outputs.name }}:sha-${{ steps.image.outputs.short_sha }}"
            echo "${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
