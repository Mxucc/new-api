name: AI-Assisted Upstream Sync

on:
  # Run for every commit pushed to this repository. The sync job always
  # checks out TARGET_BRANCH (main), so commits on other branches still
  # exercise the same unattended sync/validation path.
  push:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: ai-upstream-sync-main
  cancel-in-progress: false

env:
  TARGET_BRANCH: main
  UPSTREAM_REPOSITORY: QuantumNous/new-api
  UPSTREAM_BRANCH: main
  RECONCILE_AI_VERSION: 1.0.3

jobs:
  sync-upstream:
    if: github.repository == 'Mxucc/new-api'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      release_created: ${{ steps.release.outputs.created }}

    steps:
      - name: Checkout target branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Fetch upstream
        run: |
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git" 2>/dev/null || \
            git remote set-url upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --no-tags upstream "${UPSTREAM_BRANCH}"

      - name: Merge upstream
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          upstream_ref="upstream/${UPSTREAM_BRANCH}"

          # Kept so the deterministic retry can redo the merge from the exact
          # commit this run started from.
          echo "pre_merge_sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

          if git merge-base --is-ancestor "${upstream_ref}" HEAD; then
            echo 'result=no_changes' >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if git merge --no-edit "${upstream_ref}"; then
            echo 'result=merged' >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # The upstream billing-expression implementation is authoritative.
          # Resolve this known compatibility conflict deterministically so the
          # AI resolver is reserved for conflicts that need semantic review.
          if [[ -n "$(git diff --name-only --diff-filter=U -- controller/option.go)" ]]; then
            echo 'Resolving controller/option.go from upstream (official billing expressions).' >&2
            git checkout --theirs -- controller/option.go
            git add -- controller/option.go
          fi

          remaining_conflicts="$(git diff --name-only --diff-filter=U)"
          if [[ -z "${remaining_conflicts}" ]]; then
            git commit -m 'chore: sync upstream with official conflict resolution [skip ci]'
            echo 'result=merged' >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          conflict_manifest="${RUNNER_TEMP}/upstream-conflicts.zlist"
          git diff --name-only --diff-filter=U -z > "${conflict_manifest}"
          if [[ ! -s "${conflict_manifest}" ]]; then
            echo 'Merge failed without producing resolvable conflicts.' >&2
            exit 1
          fi

          echo 'result=conflicted' >> "${GITHUB_OUTPUT}"
          echo 'Merge conflicts detected; continuing to AI resolution.'

      - name: Install reconcile-ai
        if: steps.merge.outputs.result == 'conflicted'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "${RUNNER_TEMP}/reconcile-ai"
          # PyYAML is required for the resolver to read reconcile.yaml; without
          # it the resolver silently ignores the project's resolution prompts
          # and writes unconstrained output.
          "${RUNNER_TEMP}/reconcile-ai/bin/python" -m pip install \
            --disable-pip-version-check \
            --no-cache-dir \
            "reconcile-ai==${RECONCILE_AI_VERSION}" \
            PyYAML
          "${RUNNER_TEMP}/reconcile-ai/bin/reconcile" --help >/dev/null
          "${RUNNER_TEMP}/reconcile-ai/bin/python" -c 'import yaml'

      - name: Resolve conflicts with AI
        if: steps.merge.outputs.result == 'conflicted'
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL || 'https://api.openai.com/v1' }}
          RECONCILE_MODEL: ${{ vars.RECONCILE_MODEL || 'gpt-4o-mini' }}
        run: |
          set -euo pipefail
          if [[ -z "${OPENAI_API_KEY}" ]]; then
            echo 'OPENAI_API_KEY repository secret is required when conflicts occur.' >&2
            exit 1
          fi

          "${RUNNER_TEMP}/reconcile-ai/bin/reconcile" run \
            --verbose \
            --model "${RECONCILE_MODEL}"

      # The staging step below parses every resolved file before accepting it,
      # so the toolchains have to be available first.
      - name: Set up Bun
        if: steps.merge.outputs.result != 'no_changes'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      - name: Set up Go
        if: steps.merge.outputs.result != 'no_changes'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum

      - name: Stage conflict resolutions
        if: steps.merge.outputs.result == 'conflicted'
        shell: bash
        run: |
          set -euo pipefail
          conflict_manifest="${RUNNER_TEMP}/upstream-conflicts.zlist"

          if [[ ! -s "${conflict_manifest}" ]]; then
            echo "The conflict manifest is missing or empty: ${conflict_manifest}" >&2
            exit 1
          fi

          echo 'Original conflicted paths:'
          while IFS= read -r -d '' file; do
            printf '  %s\n' "${file}"
          done < "${conflict_manifest}"

          # reconcile-ai stages its resolutions with GitPython, which inserts a
          # stage-0 entry while leaving the merge stages (1/2/3) in place. Git
          # then still reports the path as unmerged and treats `git add` on it
          # as a silent no-op, so the index entry must be dropped explicitly
          # before the working tree content can be staged again.
          #
          # A resolution that does not even parse is never accepted: the AI
          # occasionally emits syntactically broken files. Such a path falls
          # back to a deterministic resolution instead of reaching `main`.
          #
          # The marker shapes mirror git's own detection in `git diff --check`:
          # 7+ `<`/`>` followed by space or end of line, or a line containing
          # exactly 7 `=`.
          marker_pattern='^(<{7,}|>{7,})( |$)|^={7}( |$)'

          parses() {
            case "$1" in
              *.ts|*.tsx|*.js|*.jsx|*.mjs|*.cjs)
                bun build --no-bundle --target=browser \
                  --outfile="${RUNNER_TEMP}/syntax-check.js" "$1" >/dev/null 2>&1
                ;;
              *.go)
                gofmt -e -l "$1" >/dev/null 2>&1
                ;;
              *.json)
                # Rejects duplicate keys as well as malformed JSON.
                python3 .github/scripts/validate-json.py "$1" >/dev/null 2>&1
                ;;
              *)
                return 0
                ;;
            esac
          }

          # The resolver's stage-0 entry also turns `git checkout --merge` and
          # `git checkout --theirs` into silent no-ops, so fallback candidates
          # are rebuilt from the index stages directly.
          candidates="${RUNNER_TEMP}/conflict-candidates"
          mkdir -p "${candidates}"

          stage_blob() { # $1 = stage, $2 = path, $3 = destination
            git show ":$1:$2" > "$3" 2>/dev/null
          }

          while IFS= read -r -d '' file; do
            if [[ ! -e "${file}" && ! -L "${file}" ]]; then
              echo "NOTE: ${file} is deleted locally and modified upstream; keeping the local deletion." >&2
            else
              ours="${candidates}/ours"
              base="${candidates}/base"
              theirs="${candidates}/theirs"
              accepted=''

              if ! git cat-file -e ":3:${file}" 2>/dev/null; then
                echo "NOTE: ${file} is modified locally and deleted upstream; keeping the local content." >&2
              elif ! grep -qE -- "${marker_pattern}" "${file}" && parses "${file}"; then
                accepted='resolver output'
              elif stage_blob 2 "${file}" "${ours}" && stage_blob 3 "${file}" "${theirs}"; then
                # Keep both sides of every conflicting hunk. That is the right
                # answer for additive conflicts (new list entries, new fields,
                # new functions) and `parses` rejects it whenever the two sides
                # really overlapped, in which case the upstream version wins.
                if ! stage_blob 1 "${file}" "${base}"; then
                  : > "${base}"
                fi

                git merge-file -p --union "${ours}" "${base}" "${theirs}" > "${file}" || true
                if parses "${file}"; then
                  accepted='combination of both sides'
                else
                  cp "${theirs}" "${file}"
                  accepted='upstream version'
                fi
              elif stage_blob 3 "${file}" "${theirs}"; then
                cp "${theirs}" "${file}"
                accepted='upstream version'
              fi

              if [[ -z "${accepted}" ]]; then
                echo "Cannot resolve ${file}: no usable candidate and the upstream side is unavailable." >&2
                exit 1
              fi

              echo "Using the ${accepted} for: ${file}"
            fi

            git update-index --force-remove -- "${file}"
            if [[ -e "${file}" ]]; then
              git add -f -- "${file}"
            fi
          done < "${conflict_manifest}"

          unmerged="$(git ls-files -u)"
          if [[ -n "${unmerged}" ]]; then
            echo 'Unresolved Git index entries remain after staging:' >&2
            printf '%s\n' "${unmerged}" >&2
            git status --short >&2 || true
            exit 1
          fi

          # Anything the merge or the resolver left modified in the working tree
          # must be staged, otherwise the push would publish an incomplete merge
          # while the run reports success.
          drifted="$(git diff --name-only)"
          if [[ -n "${drifted}" ]]; then
            echo 'Tracked changes are not staged and would be missing from the merge commit:' >&2
            printf '%s\n' "${drifted}" >&2
            exit 1
          fi


          # Files the merge or the resolver left untracked would be validated but
          # never committed, so publication would not match what was checked. The
          # resolver's own log directory is not part of the tree.
          untracked="$(git ls-files --others --exclude-standard | grep -v '^\.reconcile/' || true)"
          if [[ -n "${untracked}" ]]; then
            echo 'Untracked files would be missing from the merge commit:' >&2
            printf '%s\n' "${untracked}" >&2
            exit 1
          fi
          # `git diff --cached --check` detects the same conflict-marker shapes
          # git itself writes. Leftover markers must fail the run: committing
          # them would break the branch and hide the unresolved merge.
          check_output="$(git diff --cached --check || true)"
          if [[ -n "${check_output}" ]]; then
            printf '%s\n' "${check_output}" >&2
            if grep -qF 'leftover conflict marker' <<<"${check_output}"; then
              echo 'Conflict markers remain in the staged resolved content.' >&2
              exit 1
            fi

            echo 'Warning: the staged patch contains whitespace errors; continuing.' >&2
          fi

      - name: Preserve classic frontend compatibility
        if: steps.merge.outputs.result != 'no_changes'
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/apply-classic-frontend-compat.py
          git add controller/option.go

      # The merge is only committed and pushed once it has been validated, so a
      # broken resolution can never reach main. When the AI-assisted resolution
      # does not validate, the merge is redone deterministically (upstream wins
      # does not validate, the merge is redone deterministically (upstream wins
      # for every still-conflicted path) and validated again.
      - name: Validate merged tree
        id: validate
        if: steps.merge.outputs.result != 'no_changes'
        shell: bash
        env:
          GOWORK: 'off'
          MERGE_RESULT: ${{ steps.merge.outputs.result }}
          PRE_MERGE_SHA: ${{ steps.merge.outputs.pre_merge_sha }}
        run: |
          set -uo pipefail

          # The frontend unit suite is not part of the gate: upstream's own
          # revision currently fails some of those tests, so they cannot tell a
          # bad merge apart from an upstream regression. They still run
          # afterwards, without blocking the sync.
          validate() {
            ( cd web && bun install --frozen-lockfile && bun run typecheck && bun run build ) &&
              ( cd web/classic && bun install --frozen-lockfile && bun run build ) &&
              go build ./... &&
              make test
          }

          if validate; then
            echo 'Validation passed.'
            exit 0
          fi

          if [[ "${MERGE_RESULT}" != 'conflicted' ]]; then
            echo 'Validation failed after a clean merge; there is no conflict resolution to retry.' >&2
            exit 1
          fi

          if [[ -z "${PRE_MERGE_SHA}" ]]; then
            echo 'The merge step did not report the pre-merge commit; cannot retry deterministically.' >&2
            exit 1
          fi

          echo '::warning::The AI-assisted conflict resolution failed validation; retrying with the deterministic upstream-first merge.'
          git reset --hard "${PRE_MERGE_SHA}"
          git merge --no-commit "upstream/${UPSTREAM_BRANCH}" || true

          # A merge that never started would leave the pre-merge tree behind,
          # validate it, and report success without syncing anything.
          if [[ ! -f .git/MERGE_HEAD ]]; then
            echo 'The deterministic merge did not start; refusing to continue.' >&2
            exit 1
          fi

          # Every path that still conflicts takes the upstream version wholesale.
          # Merging only the conflicting hunks can splice two sides together and
          # leave syntactically broken code behind, so the whole file wins.
          while IFS= read -r path; do
            [[ -z "${path}" ]] && continue
            if git cat-file -e ":3:${path}" 2>/dev/null; then
              mkdir -p -- "$(dirname -- "${path}")"
              git show ":3:${path}" > "${path}"
              echo "Deterministic retry uses the upstream version of: ${path}"
            else
              echo "Deterministic retry follows upstream and deletes: ${path}"
              rm -f -- "${path}"
            fi

            git update-index --force-remove -- "${path}"
            if [[ -e "${path}" ]]; then
              git add -f -- "${path}"
            fi
          done <<<"$(git diff --name-only --diff-filter=U)"

          if [[ -n "$(git ls-files -u)" ]]; then
            echo 'The deterministic merge still leaves unmerged paths:' >&2
            git ls-files -u >&2
            exit 1
          fi

          if git diff --cached --quiet; then
            echo 'The deterministic merge produced no changes; refusing to publish.' >&2
            exit 1
          fi

          python3 .github/scripts/apply-classic-frontend-compat.py || exit 1
          git add -A
          echo 'RESOLUTION_MODE=deterministic-upstream-first' >> "${GITHUB_ENV}"

          validate

      - name: Frontend unit tests
        if: steps.merge.outputs.result != 'no_changes'
        continue-on-error: true
        working-directory: web
        run: bun run test

      - name: Publish synchronized merge
        if: steps.merge.outputs.result != 'no_changes'
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "$(git ls-files -u)" ]]; then
            echo 'Unmerged index entries remain; refusing to publish.' >&2
            exit 1
          fi

          # Idempotent: guarantees the fork's classic frontend support is in the
          # published tree even if an earlier step was skipped.
          python3 .github/scripts/apply-classic-frontend-compat.py
          git add controller/option.go

          message='chore: sync upstream with AI conflict resolution [skip ci]'
          if [[ "${RESOLUTION_MODE:-}" == 'deterministic-upstream-first' ]]; then
            message='chore: sync upstream with deterministic conflict resolution [skip ci]'
          fi

          if [[ -f .git/MERGE_HEAD ]] || ! git diff --cached --quiet; then
            git commit -m "${message}"
          else
            echo 'Nothing left to commit; the merged tree is already in place.'
          fi

          git push origin "HEAD:${TARGET_BRANCH}"

      - name: Ensure xdev release tag
        id: release
        if: steps.merge.outputs.result != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git fetch --tags --force upstream
          upstream_version="$(git describe --tags --abbrev=0 --match 'v*' "upstream/${UPSTREAM_BRANCH}")"
          release_tag="${upstream_version}-xdev"

          git check-ref-format "refs/tags/${release_tag}"
          echo "Upstream version: ${upstream_version}"
          echo "Release tag: ${release_tag}"
          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"

          if git ls-remote --exit-code --tags origin "refs/tags/${release_tag}" >/dev/null 2>&1; then
            echo "Release tag already exists; keeping the existing immutable tag."
          else
            git tag -a "${release_tag}" -m "Release ${release_tag}" HEAD
            git push origin "${release_tag}"
          fi

          if gh release view "${release_tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${release_tag} already exists; skipping publication."
            echo 'created=false' >> "${GITHUB_OUTPUT}"
          else
            echo "Release ${release_tag} is missing; scheduling publication."
            echo 'created=true' >> "${GITHUB_OUTPUT}"
          fi

  publish-xdev:
    name: Publish xdev release
    needs: sync-upstream
    if: needs.sync-upstream.outputs.release_created == 'true'
    uses: ./.github/workflows/release.yml
    with:
      release_tag: ${{ needs.sync-upstream.outputs.release_tag }}
    secrets: inherit
