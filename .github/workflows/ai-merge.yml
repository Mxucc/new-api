name: AI-Assisted Upstream Sync

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-upstream-sync-main
  cancel-in-progress: false

env:
  TARGET_BRANCH: main
  UPSTREAM_REPOSITORY: QuantumNous/new-api
  UPSTREAM_BRANCH: main
  RECONCILE_AI_VERSION: 1.0.3

jobs:
  sync-upstream:
    if: github.repository == 'Mxucc/new-api'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout target branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Fetch upstream
        run: |
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git" 2>/dev/null || \
            git remote set-url upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --no-tags upstream "${UPSTREAM_BRANCH}"

      - name: Merge upstream
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          upstream_ref="upstream/${UPSTREAM_BRANCH}"

          if git merge-base --is-ancestor "${upstream_ref}" HEAD; then
            echo 'result=no_changes' >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if git merge --no-edit "${upstream_ref}"; then
            echo 'result=merged' >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          conflict_manifest="${RUNNER_TEMP}/upstream-conflicts.zlist"
          git diff --name-only --diff-filter=U -z > "${conflict_manifest}"
          if [[ ! -s "${conflict_manifest}" ]]; then
            echo 'Merge failed without producing resolvable conflicts.' >&2
            exit 1
          fi

          echo 'result=conflicted' >> "${GITHUB_OUTPUT}"
          echo 'Merge conflicts detected; continuing to AI resolution.'

      - name: Install reconcile-ai
        if: steps.merge.outputs.result == 'conflicted'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "${RUNNER_TEMP}/reconcile-ai"
          "${RUNNER_TEMP}/reconcile-ai/bin/python" -m pip install \
            --disable-pip-version-check \
            --no-cache-dir \
            "reconcile-ai==${RECONCILE_AI_VERSION}"
          "${RUNNER_TEMP}/reconcile-ai/bin/reconcile" --help >/dev/null

      - name: Resolve conflicts with AI
        if: steps.merge.outputs.result == 'conflicted'
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL || 'https://api.openai.com/v1' }}
          RECONCILE_MODEL: ${{ vars.RECONCILE_MODEL || 'gpt-4o-mini' }}
        run: |
          set -euo pipefail
          if [[ -z "${OPENAI_API_KEY}" ]]; then
            echo 'OPENAI_API_KEY repository secret is required when conflicts occur.' >&2
            exit 1
          fi

          "${RUNNER_TEMP}/reconcile-ai/bin/reconcile" run \
            --verbose \
            --model "${RECONCILE_MODEL}"

      - name: Verify AI conflict resolution
        if: steps.merge.outputs.result == 'conflicted'
        shell: bash
        run: |
          set -euo pipefail
          conflict_manifest="${RUNNER_TEMP}/upstream-conflicts.zlist"

          marker_found=0
          while IFS= read -r -d '' file; do
            if [[ -f "${file}" ]] && grep -nE '^(<<<<<<< .+|=======|>>>>>>> .+)$' "${file}"; then
              echo "Conflict markers remain in ${file}" >&2
              marker_found=1
            fi
          done < "${conflict_manifest}"

          if [[ "${marker_found}" -ne 0 ]]; then
            exit 1
          fi

          if [[ -n "$(git diff --name-only --diff-filter=U)" ]]; then
            echo 'reconcile-ai left unresolved Git conflicts:' >&2
            git diff --name-only --diff-filter=U >&2
            exit 1
          fi

          while IFS= read -r -d '' file; do
            git add -A -- "${file}"
          done < "${conflict_manifest}"

          git diff --cached --check
          git commit -m 'chore: sync upstream with AI conflict resolution [skip ci]'

      - name: Set up Bun
        if: steps.merge.outputs.result != 'no_changes'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      - name: Validate default frontend
        if: steps.merge.outputs.result != 'no_changes'
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun run test
          bun run build

      - name: Validate classic frontend
        if: steps.merge.outputs.result != 'no_changes'
        working-directory: web/classic
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Set up Go
        if: steps.merge.outputs.result != 'no_changes'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum

      - name: Validate backend
        if: steps.merge.outputs.result != 'no_changes'
        env:
          GOWORK: 'off'
        run: |
          go test ./...
          (cd relaykit && go test ./...)

      - name: Push synchronized branch
        if: steps.merge.outputs.result != 'no_changes'
        run: git push origin "HEAD:${TARGET_BRANCH}"
